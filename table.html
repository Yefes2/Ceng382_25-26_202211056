<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Table</title>
  <link rel="stylesheet" href="table.css">
</head>
<body>
  <div class="container">
    <h1>Class Entry</h1>
    <form id="classForm">
      <input type="text" id="className" placeholder="Class Name" required>
      <input type="number" id="peopleCount" placeholder="Number of People" required>
      <textarea id="description" placeholder="Description" required></textarea>
      <button type="submit">Add Class</button>
    </form>

    <table id="classTable">
      <thead>
        <tr>
          <th>Class Name</th>
          <th>People</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="table.js"></script>
</body>
</html>
